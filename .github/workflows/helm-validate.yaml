name: validate-helm-values

# A broken chart baseline is invisible to a pull_request-only check: it fails
# on every PR, so it reads as pre-existing rather than as anyone's regression
# and gets stepped over. dvystrcil/immich#15 merged with this check red and
# main could not pass its own validation for two weeks (homelab#1301).
#
# Running on push to main puts the failure on the default branch, where the
# Actions Failure Watcher now looks (dvystrcil/n8n-workflow#205 covers `push`
# as well as `schedule`, and escalates on two consecutive failures).

on:
  push:
    branches: [main]
    paths:
      - 'values.yaml'
      - '.github/workflows/helm-validate.yaml'
  pull_request:
    paths:
      - 'values.yaml'
      - '.github/workflows/helm-validate.yaml'

jobs:
  helm:
    # <repo>-helm-runner (arc-isolated tier) mounts the read-only argocd-projects
    # token; the chart pin is read from the Application that deploys it
    # (homelab architecture/chart-version-source-of-truth.md, A3).
    runs-on: nvidia-k8s-device-plugin-helm-runner
    steps:
      - uses: actions/checkout@v7
      - uses: dvystrcil/helm-validate-action@v2
        with:
          chart-repo: https://nvidia.github.io/k8s-device-plugin
          chart-name: nvidia-device-plugin
          argocd-application: k8s-device-plugins/nvidia-k8s-device-plugin.yaml
          github-token-file: /etc/argocd-projects-token/token
          # This chart's own template guard refuses to render outside a
          # real namespace ("Running in the 'default' namespace is not
          # recommended") -- pass the actual deploy target
          # (argocd-projects/k8s-device-plugins destination.namespace).
          helm-set: "--namespace kube-system"
