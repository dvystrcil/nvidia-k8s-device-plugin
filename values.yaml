# THE GPU CONSTRAINT IS ON THE DRIVER, NOT THIS CHART.
#
# The card is a GeForce GTX 970 -- Maxwell, compute capability 5.2, 4GB:
#
#   nvidia-smi --query-gpu=name,driver_version,compute_cap,memory.total
#   NVIDIA GeForce GTX 970, 580.178.04, 5.2, 4096 MiB      (2026-10-02)
#
# NVIDIA retires architectures on a DRIVER-branch boundary. Kepler ended at
# 470; the Linux 580 legacy branch is the LAST for Maxwell/Pascal/Volta
# (NVIDIA a_id 3142). Past 580 this card is not degraded, it is dropped -- no
# CUDA, no device advertisement.
#
# That is enforced in dvystrcil/ansible: host_vars/192.168.86.59.yml sets
# nvidia_driver_branch: 580 (moved from 535 on 2026-10-02, homelab#1487),
# playbooks/pin-nvidia-driver.yml holds it, and
# tests/test-nvidia-driver-branch.sh fails any branch > 580 for compute < 7.5.
# It is NOT enforced by this chart version, and never was.
#
# Recorded here because the constraint was real, remembered, and attached to
# the wrong thing: `.chart-version` sat at 0.17.4 while the cluster ran 0.20.0,
# and that gap looked like a deliberate hold. It was not -- Renovate bumped the
# deploy side in argocd-projects#204 on 2026-08-28 and this file never moved.
# Chart 0.20.0 runs fine on this card today.
#
# So: bumping THIS file is safe on GPU-support grounds. Bumping the DRIVER is
# what needs care.

# Helm values for the upstream NVIDIA k8s-device-plugin chart.
# Chart: https://nvidia.github.io/k8s-device-plugin/nvidia-device-plugin
#
# Argo App pulls the chart + this values file via multi-source pattern,
# mirroring how rocm-k8s-device-plugin is structured.
#
# This DaemonSet exposes `nvidia.com/gpu` as a schedulable resource on
# every node that matches the nodeSelector below. Currently only
# k8s-node-03 carries the homelab/role=small-model-gpu label (GTX 970
# via Proxmox PCIe passthrough — see homelab#165).

# Restrict the DaemonSet to GPU-bearing nodes. Without this, the chart
# tries to schedule on every node and crash-loops on nodes without
# NVIDIA hardware. Matches the rocm chart's `node_selector` pattern.
nodeSelector:
  homelab/role: small-model-gpu

# Override the chart's default nodeAffinity. The default requires one
# of three NFD-set labels: feature.node.kubernetes.io/pci-10de.present,
# feature.node.kubernetes.io/cpu-model.vendor_id=NVIDIA, or
# nvidia.com/gpu.present (set by the GPU Operator). We don't run NFD
# or the GPU Operator — passthrough is hardware-pinned and the
# nodeSelector above is the only gate we need.
#
# Setting {} clears the default; the nodeSelector still applies.
affinity: {}

# We configured containerd's default runtime to 'nvidia' via
# `nvidia-ctk runtime configure` during node prep (see homelab#165
# AC6). So the plugin DOES NOT need a runtimeClass at the pod level.
runtimeClassName: ""

# Tolerations match the rocm plugin's pattern. CriticalAddonsOnly lets
# the DaemonSet schedule on nodes the user has tainted for
# higher-priority workloads.
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

# Default strategy: 'envvar' (the original mode) is fine for our
# single-GPU passthrough setup. 'cdi' is newer and works with
# nvidia-container-toolkit's CDI mode, but envvar is more compatible.
# Revisit if multi-GPU or MIG ever lands here.
deviceListStrategy: envvar

# ---------------------------------------------------------------------------
# GPU SHARING: time-slicing (homelab#1487 AC2)
#
# One GTX 970 serves several workloads: the small ollama lane, immich
# machine-learning, Jellyfin (NVENC, H.264 only on GM204) and obico ml-api.
# Time-slicing makes the plugin advertise `nvidia.com/gpu: 4` instead of 1;
# each workload still requests `nvidia.com/gpu: 1` and gets one slice.
#
# Time-slicing shares COMPUTE by interleaving. It does NOT partition memory:
# every slice sees all 4 GiB and nothing stops one workload taking it all. So
# the VRAM budget below is a hand-kept contract, measured, not enforced. (MPS
# could cap memory, but per-client memory limits need Volta+; MIG needs
# Ampere+. Neither applies to Maxwell.)
#
#   consumer                 budget    measured                          notes
#   ollama-small-cuda        <=1.8GiB  2720 MiB peak with llama3.2:1b    unloads after keep-alive;
#                                      (1252 MiB model + CUDA ctx/KV)    idle since n8n-workflow#267
#   immich-machine-learning  <=1.0GiB  (measure in AC3)                  CLIP + face models
#   jellyfin (NVENC)         <=0.3GiB  (measure in AC3)                  per concurrent transcode
#   obico ml-api             <=0.8GiB  (measure in AC3)                  darknet detector
#   ---------------------------------------------------------------------
#   total                    <=3.9GiB  of 4096 MiB (last 512 MiB is the slow segment)
#
# ollama's measured peak alone breaks its budget if a model is loaded while
# the others run: AC4 decides whether that lane is retired or capped.
#
# failRequestsGreaterThanOne: a pod asking for 2 slices would believe it had
# 2 GPUs' worth of memory; refuse instead of pretending.
config:
  map:
    default: |-
      version: v1
      sharing:
        timeSlicing:
          renameByDefault: false
          failRequestsGreaterThanOne: true
          resources:
            - name: nvidia.com/gpu
              replicas: 4
  default: default
